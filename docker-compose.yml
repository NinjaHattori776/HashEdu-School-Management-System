services:
  app:
    build: .
    volumes:
      - ./:/var/www
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_DATABASE=hashedu
      - DB_USERNAME=hashedu_user
      - DB_PASSWORD=secret

  webserver:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Vite dev server for frontend hot-reload during development.
  # For production, run `npm run build` and let nginx serve the built assets
  # from public/build instead of running this container.
  vite:
    image: node:20-alpine
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: hashedu
      MYSQL_USER: hashedu_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data:
