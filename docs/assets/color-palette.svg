<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="260" fill="#FFFFFF"/>
  <!-- Swatch template: x, color, hex, label -->
  <g>
    <rect x="20" y="20" width="100" height="100" fill="#1B2A4A"/>
    <text x="20" y="140" font-size="13" font-weight="bold" fill="#22262B">Ink Navy</text>
    <text x="20" y="158" font-size="12" fill="#6B7280">#1B2A4A</text>
    <text x="20" y="176" font-size="11" fill="#6B7280">Sidebar, buttons</text>
  </g>
  <g>
    <rect x="140" y="20" width="100" height="100" fill="#B8860B"/>
    <text x="140" y="140" font-size="13" font-weight="bold" fill="#22262B">Brass</text>
    <text x="140" y="158" font-size="12" fill="#6B7280">#B8860B</text>
    <text x="140" y="176" font-size="11" fill="#6B7280">Active accent</text>
  </g>
  <g>
    <rect x="260" y="20" width="100" height="100" fill="#F7F6F3" stroke="#D8D5CB"/>
    <text x="260" y="140" font-size="13" font-weight="bold" fill="#22262B">Paper</text>
    <text x="260" y="158" font-size="12" fill="#6B7280">#F7F6F3</text>
    <text x="260" y="176" font-size="11" fill="#6B7280">Content bg</text>
  </g>
  <g>
    <rect x="380" y="20" width="100" height="100" fill="#22262B"/>
    <text x="380" y="140" font-size="13" font-weight="bold" fill="#22262B">Ink Text</text>
    <text x="380" y="158" font-size="12" fill="#6B7280">#22262B</text>
    <text x="380" y="176" font-size="11" fill="#6B7280">Body text</text>
  </g>
  <g>
    <rect x="500" y="20" width="100" height="100" fill="#6B7280"/>
    <text x="500" y="140" font-size="13" font-weight="bold" fill="#22262B">Slate</text>
    <text x="500" y="158" font-size="12" fill="#6B7280">#6B7280</text>
    <text x="500" y="176" font-size="11" fill="#6B7280">Muted text</text>
  </g>
  <g>
    <rect x="620" y="20" width="100" height="100" fill="#2F7D5C"/>
    <text x="620" y="140" font-size="13" font-weight="bold" fill="#22262B">Success</text>
    <text x="620" y="158" font-size="12" fill="#6B7280">#2F7D5C</text>
    <text x="620" y="176" font-size="11" fill="#6B7280">Present, A/B grades</text>
  </g>
  <g>
    <rect x="740" y="20" width="100" height="100" fill="#B3452D"/>
    <text x="740" y="140" font-size="13" font-weight="bold" fill="#22262B">Danger</text>
    <text x="740" y="158" font-size="12" fill="#6B7280">#B3452D</text>
    <text x="740" y="176" font-size="11" fill="#6B7280">Absent, errors</text>
  </g>
  <g>
    <rect x="20" y="200" width="100" height="40" fill="#F0EEE7" stroke="#D8D5CB"/>
    <text x="20" y="255" font-size="11" fill="#6B7280">Border hairline #E4E1D8 / #F0EEE7</text>
  </g>
