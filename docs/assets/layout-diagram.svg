  <text x="600" y="283" font-size="11" fill="#B8860B">● Current</text>

  <text x="400" y="475" font-size="10" fill="#6B7280" text-anchor="middle">Fixed navy sidebar (role-aware nav) + paper content area (PageHeader → StatCards → Panels)</text>
